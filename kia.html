<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KBO 응원가 타이핑</title><link rel="stylesheet" href="style.css"></head><body class="game-page" data-team="kia"><main class="practice-shell"><section class="left-column"><div class="top-line"><a class="home-pill" href="index.html">← 홈으로</a><span class="team-kicker">CHEER TYPING PRACTICE</span></div><div class="title-area"><h1 id="teamName">팀 응원가 타이핑</h1><p class="subtitle">새 우승의 시대를 담아 타이핑!</p></div><div class="typing-area"><div class="typing-label">타이핑할 응원가</div><div class="lyrics-box" id="lyrics">오른쪽에서 응원가를 선택해 주세요.</div><div class="typing-label input-label">내가 입력한 글자</div><textarea id="typingInput" class="input-box" placeholder="응원가를 선택하고 연습 시작을 눌러주세요." disabled spellcheck="false"></textarea></div><div class="keyboard-section"><div class="keyboard-heading">가상 키보드 <small>방금 누른 키가 빨간색으로 표시됩니다 · <span id="lastKey">-</span></small></div><div class="keyboard" id="keyboard"></div></div></section><aside class="right-column"><div class="right-top"><a class="youtube-link" id="youtubeLink" target="_blank" rel="noopener">어떻게? 음악에 맞춰서!<strong>YouTube 응원가 링크 바로가기 ↗</strong></a></div><section class="lineup-panel"><h2>오늘의 라인업</h2><div class="song-list" id="songList"></div><button class="add-song" id="addSongBtn">＋ 응원가를 추가하세요!</button></section><div class="side-bottom"><div class="stats"><div class="stat"><span>타율</span><strong id="average">.000</strong></div><div class="stat"><span>정확도</span><strong id="accuracy">100%</strong></div><div class="stat"><span>남은 시간</span><strong><span id="time">60</span>초</strong></div></div><button class="start-button" id="startBtn">연습 시작하기</button></div></aside></main><div class="overlay hidden" id="countOverlay"><div class="count-card"><div class="count-number" id="countNumber">3</div><div class="count-caption">READY, SET, CHEER!</div></div></div><div class="modal-backdrop hidden" id="songModal"><div class="modal"><button class="modal-x" id="cancelSong">×</button><h3>응원가 추가하기</h3><p>새롭게 연습할 응원가 제목과 가사를 입력해 주세요.</p><label class="field"><span>응원가 제목</span><input id="songTitle" placeholder="예: 나만의 응원가"></label><label class="field"><span>응원가 가사</span><textarea id="songLyrics" placeholder="응원가 가사를 입력해 주세요."></textarea></label><div class="modal-actions"><button class="cancel-button" id="cancelSong2">취소</button><button class="save-button" id="saveSong">추가하기</button></div></div></div><div class="modal-backdrop hidden" id="resultOverlay"><div class="modal result-box"><h2 id="resultTitle">연습 완료!</h2><div class="result-score" id="resultAccuracy">100%</div><p>정확도</p><p>정확하게 입력한 글자 <b id="resultCorrect">0자</b></p><div class="modal-actions"><button class="save-button" id="resultRetry">다시 연습</button><button class="cancel-button" id="closeResult">닫기</button></div></div></div><script src="teams.js"></script><script src="game.js"></script></body></html>
