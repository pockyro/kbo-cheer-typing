<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>기아 타이거즈 응원가 타자연습</title><link rel="stylesheet" href="style.css"></head><body style="background:linear-gradient(180deg,#e85f75 0%,#244b7d 100%)"><main class="team-page"><a class="back" href="index.html">← 구단 선택으로</a><header class="team-head"><h1>기아 타이거즈</h1><p>응원가를 듣는 마음으로, 힘차게 타이핑!</p></header><section class="practice"><div class="toolbar"><label>연습할 응원가 <select id="songSelect"></select></label><div class="stats"><div class="stat">타수<b id="speed">0</b></div><div class="stat">정확도<b id="accuracy">100%</b></div><div class="stat">진행<b id="progress">1 / 1</b></div></div></div><div id="sentence" class="sentence"></div><input id="typingInput" class="typing-input" autocomplete="off" spellcheck="false" placeholder="위 문장을 여기에 입력하세요..."><p class="hint">문장을 정확히 입력하면 다음 문장으로 자동 이동합니다. Enter 또는 스페이스바로도 진행할 수 있어요.</p><div class="keyboard"><div class="keyrow"><span class="key">ㅂ</span><span class="key">ㅈ</span><span class="key">ㄷ</span><span class="key">ㄱ</span><span class="key">ㅅ</span><span class="key">ㅛ</span><span class="key">ㅕ</span><span class="key">ㅑ</span><span class="key">ㅐ</span><span class="key">ㅔ</span></div><div class="keyrow"><span class="key">ㅁ</span><span class="key">ㄴ</span><span class="key">ㅇ</span><span class="key">ㄹ</span><span class="key">ㅎ</span><span class="key">ㅗ</span><span class="key">ㅓ</span><span class="key">ㅏ</span><span class="key">ㅣ</span></div><div class="keyrow"><span class="key">ㅋ</span><span class="key">ㅌ</span><span class="key">ㅊ</span><span class="key">ㅍ</span><span class="key">ㅠ</span><span class="key">ㅜ</span><span class="key">ㅡ</span><span class="key wide">space</span></div></div><div id="result" class="result"><h3>연습 완료! 🎉</h3><p id="resultText"></p><button id="retry" class="action">다시 연습하기</button></div><div class="creator"><h3>나만의 응원가 추가하기</h3><input id="newName" placeholder="응원가 제목"><textarea id="newLines" p
