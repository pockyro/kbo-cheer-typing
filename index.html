<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KBO 응원가 타자연습</title><link rel="stylesheet" href="style.css"></head><body class="home"><header class="hero"><div class="eyebrow">KOREAN BASEBALL • CHEER TYPING</div><h1>KBO 응원가 타자연습</h1><p class="hero-sub">좋아하는 팀의 응원가를 입력하며 승리를 외쳐보세요!</p><div class="type-show" aria-label="응원가 자동 타이핑"><span id="heroTyping"></span><i></i></div></header><main class="home-main"><div class="section-heading"><div><span class="eyebrow dark">CHOOSE YOUR TEAM</span><h2>응원하는 구단을 선택하세요</h2></div><span class="team-count">10 TEAMS</span></div><section class="team-grid" id="teamGrid"></section><footer>PLAY • TYPE • CHEER <span>© KBO CHEER TYPING</span></footer></main><script src="teams.js"></script><script>const phrases=['최강 롯데 자이언츠!','한화 이글스 승리를 향해!','함께 외쳐요, 우리의 응원가!'];let p=0,c=0,del=false;function type(){const el=document.getElementById('heroTyping'),s=phrases[p];el.textContent=s.slice(0,c);if(!del&&c++===s.length){del=true;setTimeout(type,1300);return}if(del&&c--===0){del=false;p=(p+1)%phrases.length}setTimeout(type,del?55:105)}type();document.getElementById('teamGrid').innerHTML=TEAMS.map(t=>`<a class="team-card" href="${t.id}.html" style="--team:${t.color};--soft:${t.soft}"><span class="team-mark">${t.mark}</span><span class="team-info"><b>${t.name}</b><small>${t.slogan}</small></span><span class="arrow">↗</span></a>`).join('');</script></body></html>
