<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KBO 응원가 타자연습</title><link rel="stylesheet" href="style.css"></head><body class="home-page"><main class="home-shell"><header class="home-head"><span class="eyebrow">KBO CHEER TYPING</span><h1>KBO 응원가 타자연습</h1><p>좋아하는 구단의 응원가로 타이핑 실력을 키워보세요!</p><div class="auto-line" id="autoLine">최강 롯데 자이언츠! 승리를 향해 함께 외쳐봐요!</div></header><section class="team-grid" id="teamGrid"></section><footer>CHOOSE YOUR TEAM · TYPE YOUR CHEER</footer></main><script src="teams.js"></script><script>document.getElementById('teamGrid').innerHTML=TEAMS.map(t=>`<a class="team-card" href="${t.id}.html" style="--team:${t.color};--soft:${t.soft}"><span class="team-mark">${t.mark}</span><span class="team-info"><b>${t.name}</b><small>${t.slogan}</small></span><span class="team-arrow">→</span></a>`).join('');const lines=['최강 롯데 자이언츠! 승리를 향해 함께 외쳐봐요!','독수리처럼 높이 날아올라!','오늘도 우리의 목소리로 승리를 응원해요!'];let i=0,j=0,del=false;function type(){let el=document.getElementById('autoLine'),s=lines[i];el.textContent=s.slice(0,j);if(!del&&j<s.length)j++;else if(del&&j>0)j--;else if(!del){del=true;setTimeout(type,1100);return}else{del=false;i=(i+1)%lines.length}setTimeout(type,del?35:75)}type();</script></body></html>
